# AbilityBench-AV real-data preparation config.
# Data-root variant for the paper build.  Code remains under /home/senzeyu2/code/CapPlan,
# while every large/downloaded/generated data artifact lives under:
#   /data0/senzeyu2/dataset/CapPlan/data

seed: 13
num_workers: 0

# Heavy scene materialization policy.  The complete immutable nuPlan substrate is
# inventoried separately by `index-nuplan-full`; these settings control only the
# expensive history + accessibility-graph + PUDO candidate corpus.
scene_selection:
  checkpoint_interval: 1000
  # Keep disabled by default so configured-cap builds preserve the previous
  # deterministic ScenarioFilter semantics.  These can be enabled deliberately
  # for an additional temporally de-clustered/non-stationary experimental set.
  timestamp_threshold_s: null
  ego_displacement_minimum_m: null

nuplan:
  # This machine's nuPlan v1.1 layout.  Train has been organized into four
  # city-specific folders; val/test intentionally remain mixed-city folders.
  # `inspect-nuplan` classifies each mixed DB from SQLite log.location and
  # writes fingerprint-guarded per-city manifests.  map_names is retained as a
  # second safety filter; DB files are never copied or moved merely to split by
  # city.
  # data/nuplan/nuplan-v1.1/splits/train_{boston,pittsburgh,vegas,singapore}/*.db
  # data/nuplan/nuplan-v1.1/splits/{val,test}/*.db
  # data/nuplan/maps/nuplan-maps-v1.0.json
  # data/nuplan/maps/<map-name>/<location-version>/map.gpkg
  data_root: "/data0/senzeyu2/dataset/CapPlan/data/nuplan"
  db_root: "/data0/senzeyu2/dataset/CapPlan/data/nuplan/nuplan-v1.1/splits"
  map_root: "/data0/senzeyu2/dataset/CapPlan/data/nuplan/maps"
  map_version: nuplan-maps-v1.0

external_root: "/data0/senzeyu2/dataset/CapPlan/data/external"
outputs_root: "/data0/senzeyu2/dataset/CapPlan/data/outputs"
# Replace this with measured/verified vehicle interfaces for paper results.
fleet_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/fleet/vehicle_interfaces.jsonl"

quality:
  # bootstrap: real nuPlan + pedestrian topology; missing attributes remain
  # unknown/fail-closed.  Useful for pipeline bring-up, not main results.
  # hybrid: real nuPlan + real GIS/OSM topology; observed/derived fields are
  # preserved and only truly missing benchmark variables may be deterministically
  # simulated with per-field provenance. Hybrid is benchmark truth, never a claim
  # of exact real-city site ground truth.
  # paper: audited/authoritative city evidence only; missing fields fail closed.
  source_policy: bootstrap
  min_graph_nodes: 100
  min_graph_edges: 150
  min_paper_eligible_pudos_per_episode: 2
  min_hybrid_eligible_pudos_per_episode: 2
  min_episode_pudo_coverage_rate: 0.80

service:
  # Eight same-scene/same-OD contracts: one base plus seven stricter variants
  # covering the axes used by the paper's T4 counterfactual experiment.
  capability_profiles: "{project_root}/configs/capability_profiles.counterfactual.yaml"
  demand_sources_config: "{project_root}/configs/demand.counterfactual.yaml"
  num_requests_per_episode: 8

pudo:
  candidate_radius_m: 120
  # Full-city graphs can contain hundreds of generic sidewalk vertices near one
  # route. Keep every explicit curb/curb-ramp/public candidate, but spatially
  # thin the generic fail-closed fallback before expensive evidence matching.
  max_fallback_graph_candidates_per_episode: 128
  fallback_candidate_spacing_m: 20.0

overpass:
  # Explicit `download` stage only; `all` never triggers online scraping.
  endpoint: https://overpass-api.de/api/interpreter
  timeout_s: 180
  sleep_s: 12

splits:
  train:
    cities: [boston, pittsburgh, vegas, singapore]
    require_all_cities: true
    db_dirs: [train_boston, train_pittsburgh, train_vegas, train_singapore]
    # Avoid scanning all four train DB directories once per city.
    db_dirs_by_city:
      boston: [train_boston]
      pittsburgh: [train_pittsburgh]
      vegas: [train_vegas]
      singapore: [train_singapore]
    max_scenarios_per_city: 1000
  val:
    # The official val DB directory contains multiple cities. inspect-nuplan
    # reads SQLite log.location and creates fingerprint-guarded per-city DB
    # manifests; ScenarioFilter(map_names=...) is retained as a second guard.
    # DB files are never copied/moved merely to create city subsets.
    cities: [boston, pittsburgh, vegas, singapore]
    db_dirs: [val]
    max_scenarios_per_city: 250
  test:
    # Same mixed-DB policy as val: SQLite log.location manifest first, map_names
    # as a second guard.
    cities: [boston, pittsburgh, vegas, singapore]
    db_dirs: [test]
    max_scenarios_per_city: 250

cities:
  boston:
    require_audited_core_evidence: true
    map_names: [us-ma-boston]
    location_aliases: [us-ma-boston, boston]
    bbox: [42.30, -71.15, 42.42, -70.98]
    georeference_json: "/data0/senzeyu2/dataset/CapPlan/data/external/georeference/boston.json"
    osm_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/osm/boston_sidewalks.geojson"
    opensidewalks_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/opensidewalks/boston.geojson"
    city_gis_dir: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/city_gis/boston"
    city_gis_authoritative: true
    city_gis_has_pedestrian_topology: true
    curb_inventory_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_inventory/boston.jsonl"
    curb_regulation_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_regulations/boston.jsonl"
    entrance_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/entrances/boston.geojson"
    elevation_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/dem/boston.jsonl"
    manual_audit_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/audits/boston/manual_audit_manifest.jsonl"
    provenance_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/manifests/boston.json"

  pittsburgh:
    require_audited_core_evidence: true
    map_names: [us-pa-pittsburgh-hazelwood]
    location_aliases: [us-pa-pittsburgh-hazelwood, pittsburgh]
    bbox: [40.38, -80.04, 40.48, -79.88]
    georeference_json: "/data0/senzeyu2/dataset/CapPlan/data/external/georeference/pittsburgh.json"
    osm_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/osm/pittsburgh_sidewalks.geojson"
    opensidewalks_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/opensidewalks/pittsburgh.geojson"
    city_gis_dir: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/city_gis/pittsburgh"
    # Fail closed by default. Set true only after the directory contains official WPRDC/City layers or add a manual audit manifest.
    city_gis_authoritative: false
    # WPRDC Sidewalks and Steps supplies real pedestrian geometry, but not the
    # physical width/slope ground truth required for boarding feasibility.
    city_gis_has_pedestrian_topology: true
    pudo_candidate_sources:
      - "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/candidates/pittsburgh/payment_points_current.jsonl"
    curb_inventory_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_inventory/pittsburgh.jsonl"
    curb_regulation_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_regulations/pittsburgh.jsonl"
    entrance_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/entrances/pittsburgh.geojson"
    elevation_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/dem/pittsburgh.jsonl"
    manual_audit_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/audits/pittsburgh/manual_audit_manifest.jsonl"
    provenance_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/manifests/pittsburgh.json"

  vegas:
    require_audited_core_evidence: true
    # Expanded south from 36.07 to cover the full nuPlan Las Vegas map before spatial-alignment gating.
    map_names: [us-nv-las-vegas-strip]
    location_aliases: [us-nv-las-vegas-strip, las_vegas, las-vegas, vegas]
    bbox: [36.055, -115.23, 36.20, -115.10]
    georeference_json: "/data0/senzeyu2/dataset/CapPlan/data/external/georeference/vegas.json"
    osm_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/osm/vegas_sidewalks.geojson"
    opensidewalks_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/opensidewalks/vegas.geojson"
    city_gis_dir: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/city_gis/vegas"
    # nuPlan's Strip map is primarily unincorporated Clark County. The
    # recommended fetcher now uses Clark County pwRamps/pwConcrete and the
    # Strip sidewalk line layer. They are authoritative for geometry/topology,
    # not for curb height, sidewalk clear width or general AV PUDO legality.
    city_gis_authoritative: true
    city_gis_has_pedestrian_topology: true
    # City of Las Vegas taxi zones are jurisdiction-limited and intentionally
    # excluded from the default Strip PUDO candidate set.
    pudo_candidate_sources: []
    curb_inventory_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_inventory/vegas.jsonl"
    curb_regulation_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_regulations/vegas.jsonl"
    entrance_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/entrances/vegas.geojson"
    elevation_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/dem/vegas.jsonl"
    manual_audit_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/audits/vegas/manual_audit_manifest.jsonl"
    provenance_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/manifests/vegas.json"

  singapore:
    require_audited_core_evidence: true
    map_names: [sg-one-north]
    location_aliases: [sg-one-north, singapore]
    bbox: [1.27, 103.75, 1.33, 103.82]
    georeference_json: "/data0/senzeyu2/dataset/CapPlan/data/external/georeference/singapore.json"
    osm_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/osm/singapore_sidewalks.geojson"
    opensidewalks_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/opensidewalks/singapore.geojson"
    city_gis_dir: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/city_gis/singapore"
    # OneMap/LTA layers must be curated and field-mapped before they count as authoritative accessibility evidence.
    city_gis_authoritative: false
    # Official LTA Footpath can provide pedestrian topology when downloaded.
    city_gis_has_pedestrian_topology: true
    pudo_candidate_sources:
      - "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/candidates/singapore/passenger_pickup_bay.jsonl"
      - "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/candidates/singapore/taxi_stand.jsonl"
    curb_inventory_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_inventory/singapore.jsonl"
    curb_regulation_jsonl: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/curb_regulations/singapore.jsonl"
    entrance_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/entrances/singapore.geojson"
    elevation_source: "/data0/senzeyu2/dataset/CapPlan/data/external/normalized/dem/singapore.jsonl"
    manual_audit_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/audits/singapore/manual_audit_manifest.jsonl"
    provenance_manifest: "/data0/senzeyu2/dataset/CapPlan/data/external/manifests/singapore.json"
